<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retention &amp; advances — MEC E-Invoicing Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
/* page-local — OTA positions */
.otatag {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.35;
  padding: 4px 10px; border-radius: var(--r-sm); white-space: normal;
  color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent);
}
.otatag svg { width: 13px; height: 13px; flex: none; }
.pcard { margin-bottom: 16px; }
.pcard .card-head { align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.pcard h3 { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.25; }
.plabel { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 5px; }
.basis { font-size: 14.5px; line-height: 1.55; }
.treat { margin: 6px 0 0; padding-left: 20px; }
.treat li { font-size: 14.5px; line-height: 1.55; margin-bottom: 7px; }
.treat li:last-child { margin-bottom: 0; }
.pblock + .pblock { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.channels { font-size: 13.5px; line-height: 1.5; color: var(--text-mid); }
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.chd { font-size: 15px; font-weight: 700; margin-top: 2px; }
.big-n { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.big-cap { font-size: 12.5px; color: var(--text-mid); margin-top: 6px; line-height: 1.45; }
.invln { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; font-size: 13.5px; }
.invln .h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-lo); }
.invln .r { text-align: right; font-variant-numeric: tabular-nums; }
.invln .tot { border-top: 1px solid var(--line-hard); margin-top: 5px; padding-top: 7px; font-weight: 700; }
.invln .short-row { color: var(--warn); }
@media (max-width: 760px) { .contrast { grid-template-columns: 1fr; } }
</style>
</head>
<body class="surface-hub" data-surface="hub" data-nav="retention"
      data-step="hub-retention"
      data-crumbs="OTA positions / Retention money &amp; advances"
      data-hint="How Fawtara reads retention and advance payments on lump-sum contracts — VAT on the full certified value, the advance taxed once. To confirm with the OTA.">

<main class="main">
  <div class="page">

    <div class="page-head">
      <div class="grow">
        <div class="page-title">
          <h1>Retention money &amp; advance payments</h1>
          <span class="pill pill-warn"><i class="dot"></i>To confirm</span>
        </div>
        <p class="page-sub" id="page-sub"></p>
      </div>
    </div>

    <div id="frame" class="mb16"></div>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Recommended position</div>
          <h2>What Fawtara takes to the OTA</h2>
        </div>
      </div>
      <div id="positions"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Worked example</div>
          <h2>Milestone 4, with the advance recovered and retention held</h2>
        </div>
      </div>
      <div id="example"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Why it matters</div>
          <h2>The same retention, two possible readings</h2>
        </div>
      </div>
      <div id="contrast"></div>
    </section>

    <div id="closing" class="mt24"></div>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {

  function positionCard(p) {
    var lis = p.treatment.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    return '<div class="card pcard">' +
      '<div class="card-head">' +
        '<div class="grow">' +
          '<div class="eyebrow">Agenda · ' + p.agenda + '</div>' +
          '<h3>' + p.headline + '</h3>' +
        '</div>' +
        '<span class="otatag">' + icon('clock', 'otatag-ico') + p.tag + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="pblock">' +
          '<div class="plabel">Basis</div>' +
          '<div class="basis">' + p.basis + '</div>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">How Fawtara reads the treatment</div>' +
          '<ol class="treat">' + lis + '</ol>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">Why it matters</div>' +
          '<div class="channels">' + p.channels + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function pos(id) { return OTA_POSITIONS.filter(function (p) { return p.id === id; })[0]; }

  document.getElementById('frame').innerHTML = teach(
    'On a lump-sum contract the client pays an advance up front, recovers it from later milestones, and holds back a ' +
    'retention until handover. The OTA has not yet settled when VAT falls due on each. Below is ' +
    '<strong>Fawtara&rsquo;s recommended reading</strong> to bring to the OTA. It carries the amber ' +
    '<em>to confirm with OTA</em> tag until agreed.');

  document.getElementById('positions').innerHTML = positionCard(pos('retention'));

  var C = CONTRACT;
  var inv = INVOICES.filter(function (d) { return d.no === 'MEC-INV-2026-00382'; })[0];
  var S = SETTLEMENT;
  var ms4 = S.ms4, vo = C.variation.value;
  var net = S.net, vat = net * VAT_RATE / 100, gross = S.total;
  var advRecGross = S.prepaid, ret = S.retention;
  var payable = S.payable, due = S.cashDue;

  document.getElementById('example').innerHTML =
    '<div class="card">' +
      '<div class="card-head">' +
        '<div class="grow"><div class="eyebrow">' + C.client + ' · ' + C.no + ' · contract value OMR ' + omr(C.value) + '</div>' +
          '<h3 style="font-size:16px;font-weight:700;margin-top:2px">' + inv.no + ' under Fawtara&rsquo;s reading</h3></div>' +
        '<span class="chip warn">Advance and retention lines · to confirm</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="invln">' +
          '<div class="h">Line</div><div class="h r">Net</div><div class="h r">VAT 5%</div>' +
          '<div>Milestone 4 · 15% of contract</div><div class="r">' + omr(ms4) + '</div><div class="r">' + omr(ms4 * 0.05) + '</div>' +
          '<div>' + C.variation.no + ' · approved variation</div><div class="r">' + omr(vo) + '</div><div class="r">' + omr(vo * 0.05) + '</div>' +
          '<div class="tot">Taxable total · VAT on the full value</div><div class="r tot">' + omr(net) + '</div><div class="r tot">' + omr(vat) + '</div>' +
        '</div>' +
        '<div class="invln" style="margin-top:14px">' +
          '<div class="h">Settlement</div><div class="h r"></div><div class="h r">OMR</div>' +
          '<div>Invoice total with VAT</div><div></div><div class="r">' + omr(gross) + '</div>' +
          '<div class="short-row">Advance recovered · ' + C.advancePct + '% of Milestone 4, VAT already paid · prepaid amount (BT-113)</div><div></div><div class="r short-row">−' + omr(advRecGross) + '</div>' +
          '<div class="tot">Payable on the e-invoice (BT-115)</div><div></div><div class="r tot">' + omr(payable) + '</div>' +
          '<div class="short-row">Retention held · ' + C.retentionPct + '% of net · payment term, not on the e-invoice</div><div></div><div class="r short-row">−' + omr(ret) + '</div>' +
          '<div class="tot">Cash due now</div><div></div><div class="r tot">' + omr(due) + '</div>' +
        '</div>' +
        '<div class="exminor" style="font-size:13px;color:var(--text-mid);margin-top:12px;line-height:1.5">' +
          'The advance of OMR ' + omr(C.value * C.advancePct / 100) + ' was invoiced with VAT when it was received, so the recovery ' +
          'references that advance invoice and VAT is <strong>not charged twice</strong>. The retention is released at handover ' +
          'as a payment, with no new invoice. The tracked invoice is sent today at its full taxable value; showing the advance ' +
          'and retention amounts on the e-invoice itself is part of what is being confirmed.</div>' +
      '</div>' +
    '</div>';

  var retVat = ret * 0.05;
  document.getElementById('contrast').innerHTML =
    '<div class="contrast">' +
      '<div class="card">' +
        '<div class="card-body">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' + icon('check', 'nav-ico') +
            '<span class="chd">VAT now, on the full value</span></div>' +
          '<div class="big-n" style="color:var(--ok)">' + omr(vat) + '</div>' +
          '<div class="big-cap">Fawtara&rsquo;s reading: the milestone is supplied and invoiced now, so all its VAT is due now. ' +
            'Release of the retention later is just a payment.</div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-body">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' + icon('alert', 'nav-ico') +
            '<span class="chd">VAT on retention deferred to release</span></div>' +
          '<div class="big-n" style="color:var(--warn)">' + omr(vat - retVat) + '</div>' +
          '<div class="big-cap">The alternative reading: VAT on the retained ' + omr(ret) + ' (OMR ' + omr(retVat) + ') falls due only when it is ' +
            'released — which would need a second invoice at handover.</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('page-sub').innerHTML =
    'Fawtara&rsquo;s reading: VAT on the full certified value when a milestone is invoiced; the advance taxed once, when ' +
    'received, and recovered as an amount already paid. To confirm with the OTA.';

  document.getElementById('closing').innerHTML = notice('warn',
    '<strong>This is a recommended position, not a settled rule.</strong> Fawtara will put the retention and advance ' +
    'treatment to the OTA. If the Authority defers VAT on retention, a release invoice is added at handover and the mapping changes.');

})();
</script>
</body>
</html>
