<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take-or-pay — IGC E-Invoicing Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
/* page-local — OTA positions */
.otatag {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.35;
  padding: 4px 10px; border-radius: var(--r-sm); white-space: normal;
  color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent);
}
.otatag svg { width: 13px; height: 13px; flex: none; }
.pcard { margin-bottom: 16px; }
.pcard .card-head { align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.pcard h3 { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.25; }
.plabel { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 5px; }
.basis { font-size: 14.5px; line-height: 1.55; }
.treat { margin: 6px 0 0; padding-left: 20px; }
.treat li { font-size: 14.5px; line-height: 1.55; margin-bottom: 7px; }
.treat li:last-child { margin-bottom: 0; }
.pblock + .pblock { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.channels { font-size: 13.5px; line-height: 1.5; color: var(--text-mid); }
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.chd { font-size: 15px; font-weight: 700; margin-top: 2px; }
.big-n { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.big-cap { font-size: 12.5px; color: var(--text-mid); margin-top: 6px; line-height: 1.45; }
.invln { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; font-size: 13.5px; }
.invln .h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-lo); }
.invln .r { text-align: right; font-variant-numeric: tabular-nums; }
.invln .tot { border-top: 1px solid var(--line-hard); margin-top: 5px; padding-top: 7px; font-weight: 700; }
.invln .short-row { color: var(--warn); }
@media (max-width: 760px) { .contrast { grid-template-columns: 1fr; } }
</style>
</head>
<body class="surface-hub" data-surface="hub" data-nav="takeorpay"
      data-step="hub-takeorpay"
      data-crumbs="OTA positions / Take-or-pay"
      data-hint="How Fawtara reads take-or-pay shortfall charges — consideration for availability, standard-rated. To confirm with the OTA.">

<main class="main">
  <div class="page">

    <div class="page-head">
      <div class="grow">
        <div class="page-title">
          <h1>Take-or-pay shortfall</h1>
          <span class="pill pill-warn"><i class="dot"></i>To confirm</span>
        </div>
        <p class="page-sub" id="page-sub"></p>
      </div>
    </div>

    <div id="frame" class="mb16"></div>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Recommended position</div>
          <h2>What Fawtara takes to the OTA</h2>
        </div>
      </div>
      <div id="positions"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Worked example</div>
          <h2>A shortfall charge, on its own line</h2>
        </div>
      </div>
      <div id="example"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Why it matters</div>
          <h2>The same shortfall, two possible readings</h2>
        </div>
      </div>
      <div id="contrast"></div>
    </section>

    <div id="closing" class="mt24"></div>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {

  function positionCard(p) {
    var lis = p.treatment.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    return '<div class="card pcard">' +
      '<div class="card-head">' +
        '<div class="grow">' +
          '<div class="eyebrow">Agenda · ' + p.agenda + '</div>' +
          '<h3>' + p.headline + '</h3>' +
        '</div>' +
        '<span class="otatag">' + icon('clock', 'otatag-ico') + p.tag + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="pblock">' +
          '<div class="plabel">Basis</div>' +
          '<div class="basis">' + p.basis + '</div>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">How Fawtara reads the treatment</div>' +
          '<ol class="treat">' + lis + '</ol>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">Why it matters</div>' +
          '<div class="channels">' + p.channels + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function pos(id) { return OTA_POSITIONS.filter(function (p) { return p.id === id; })[0]; }

  document.getElementById('frame').innerHTML = teach(
    'When a customer takes less gas than the contracted minimum, IGC bills the shortfall. The OTA has not yet ' +
    'settled how that charge is taxed. Below is <strong>Fawtara&rsquo;s recommended reading</strong> to bring to the ' +
    'OTA. It carries the amber <em>to confirm with OTA</em> tag until agreed.');

  document.getElementById('positions').innerHTML = positionCard(pos('takeorpay'));

  var row = NOMINATIONS.rows.filter(function (r) { return r.shortfall > 0; })[0];
  var delivered = row.metered * row.price, charge = row.shortfall * row.price;
  var net = delivered + charge;
  document.getElementById('example').innerHTML =
    '<div class="card">' +
      '<div class="card-head">' +
        '<div class="grow"><div class="eyebrow">' + row.cust + ' · ' + row.contract + ' · ' + NOMINATIONS.period + '</div>' +
          '<h3 style="font-size:16px;font-weight:700;margin-top:2px">Invoice for the month, if the shortfall is billed</h3></div>' +
        '<span class="chip warn">Shortfall line · to confirm</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="invln">' +
          '<div class="h">Line</div><div class="h r">Net</div><div class="h r">VAT 5%</div>' +
          '<div>Gas delivered · ' + num(row.metered) + ' MMBtu × ' + omr(row.price) + '</div>' +
            '<div class="r">' + omr(delivered) + '</div><div class="r">' + omr(delivered * 0.05) + '</div>' +
          '<div class="short-row">Take-or-pay shortfall · ' + num(row.shortfall) + ' MMBtu × ' + omr(row.price) + '</div>' +
            '<div class="r short-row">' + omr(charge) + '</div><div class="r short-row">' + omr(charge * 0.05) + '</div>' +
          '<div class="tot">Invoice total</div><div class="r tot">' + omr(net) + '</div><div class="r tot">' + omr(net * 0.05) + '</div>' +
        '</div>' +
        '<div class="exminor" style="font-size:13px;color:var(--text-mid);margin-top:12px;line-height:1.5">' +
          'Metered ' + num(row.metered) + ' MMBtu against a minimum of ' + num(row.minimum) + '. The shortfall of ' +
          num(row.shortfall) + ' MMBtu is charged at the contract price as a <strong>separate line</strong>, so it can be ' +
          're-classified without touching the delivered-volume line.</div>' +
      '</div>' +
    '</div>';

  document.getElementById('contrast').innerHTML =
    '<div class="contrast">' +
      '<div class="card">' +
        '<div class="card-body">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' + icon('check', 'nav-ico') +
            '<span class="chd">Consideration — 5% VAT</span></div>' +
          '<div class="big-n" style="color:var(--ok)">' + omr(charge * 0.05) + '</div>' +
          '<div class="big-cap">Fawtara&rsquo;s reading: the customer pays for gas being made available, whether or not ' +
            'it is taken. The charge is standard-rated and cleared on the invoice.</div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-body">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' + icon('alert', 'nav-ico') +
            '<span class="chd">Compensation — outside VAT</span></div>' +
          '<div class="big-n" style="color:var(--warn)">' + omr(0) + '</div>' +
          '<div class="big-cap">The alternative reading: the charge compensates for a breach of volume and carries no ' +
            'VAT. The invoice line would then be out of scope.</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('page-sub').innerHTML =
    'Fawtara&rsquo;s reading: a take-or-pay shortfall is consideration for the availability of gas, so it is standard-rated ' +
    'at 5% on its own invoice line. To confirm with the OTA.';

  document.getElementById('closing').innerHTML = notice('warn',
    '<strong>This is a recommended position, not a settled rule.</strong> Fawtara will put the shortfall treatment ' +
    'to the OTA. If the Authority reads it as compensation, the line moves out of VAT scope and the mapping changes.');

})();
</script>
</body>
</html>
