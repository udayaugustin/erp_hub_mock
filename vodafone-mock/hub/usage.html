<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out-of-bundle — Vodafone Oman E-Invoicing Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
/* page-local — OTA positions */
.otatag {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.35;
  padding: 4px 10px; border-radius: var(--r-sm); white-space: normal;
  color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent);
}
.otatag svg { width: 13px; height: 13px; flex: none; }
.pcard { margin-bottom: 16px; }
.pcard .card-head { align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.pcard h3 { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.25; }
.plabel { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 5px; }
.basis { font-size: 14.5px; line-height: 1.55; }
.treat { margin: 6px 0 0; padding-left: 20px; }
.treat li { font-size: 14.5px; line-height: 1.55; margin-bottom: 7px; }
.treat li:last-child { margin-bottom: 0; }
.pblock + .pblock { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.channels { font-size: 13.5px; line-height: 1.5; color: var(--text-mid); }
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.chd { font-size: 15px; font-weight: 700; margin-top: 2px; }
.big-n { font-family: var(--font-mono); font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.big-cap { font-size: 12.5px; color: var(--text-mid); margin-top: 6px; line-height: 1.45; }
.invln { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; font-size: 13.5px; }
.invln .h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-lo); }
.invln .r { text-align: right; font-variant-numeric: tabular-nums; }
.invln .tot { border-top: 1px solid var(--line-hard); margin-top: 5px; padding-top: 7px; font-weight: 700; }
.invln .oob-row { color: var(--warn); }
@media (max-width: 760px) { .contrast { grid-template-columns: 1fr; } }
</style>
</head>
<body class="surface-hub" data-surface="hub" data-nav="usage"
      data-step="hub-usage"
      data-crumbs="OTA positions / Out-of-bundle"
      data-hint="How Fawtara reads out-of-bundle usage — taxable at consumption, aggregated into the monthly postpaid invoice. To confirm with the OTA.">

<main class="main">
  <div class="page">

    <div class="page-head">
      <div class="grow">
        <div class="page-title">
          <h1>Out-of-bundle usage</h1>
          <span class="pill pill-warn"><i class="dot"></i>To confirm</span>
        </div>
        <p class="page-sub" id="page-sub"></p>
      </div>
    </div>

    <div id="frame" class="mb16"></div>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Recommended position</div>
          <h2>What Fawtara takes to the OTA</h2>
        </div>
      </div>
      <div id="positions"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Worked example</div>
          <h2>One monthly invoice, out-of-bundle itemised inside it</h2>
        </div>
      </div>
      <div id="example"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Why aggregation matters</div>
          <h2>One invoice per cycle, not one per event</h2>
        </div>
      </div>
      <div id="contrast"></div>
    </section>

    <div id="closing" class="mt24"></div>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {

  function positionCard(p) {
    var lis = p.treatment.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    return '<div class="card pcard">' +
      '<div class="card-head">' +
        '<div class="grow">' +
          '<div class="eyebrow">Agenda · ' + p.agenda + '</div>' +
          '<h3>' + p.headline + '</h3>' +
        '</div>' +
        '<span class="otatag">' + icon('clock', 'otatag-ico') + p.tag + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="pblock">' +
          '<div class="plabel">Basis</div>' +
          '<div class="basis">' + p.basis + '</div>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">How Fawtara reads the treatment</div>' +
          '<ol class="treat">' + lis + '</ol>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">At scale</div>' +
          '<div class="channels">' + p.channels + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function pos(id) { return OTA_POSITIONS.filter(function (p) { return p.id === id; })[0]; }

  document.getElementById('frame').innerHTML = teach(
    'Out-of-bundle usage — data, calls or SMS beyond the plan allowance — is the second treatment the OTA has not ' +
    'yet settled. Below is <strong>Fawtara&rsquo;s recommended reading</strong> to bring to Thursday&rsquo;s ' +
    'session: taxable at consumption, but invoiced with the rest of the monthly postpaid cycle rather than as a ' +
    'separate e-invoice per event. It carries the amber <em>to confirm with OTA</em> tag until agreed.');

  document.getElementById('positions').innerHTML = positionCard(pos('oob'));

  /* worked example — the Red 8 + out-of-bundle postpaid row from the B2C batch */
  var row = B2C_BATCH.rows.filter(function (r) { return /out-of-bundle/.test(r.item); })[0];
  var plan = 9.286, oob = 2.619;   /* net split within the one invoice: plan + out-of-bundle = 11.905 */
  document.getElementById('example').innerHTML =
    '<div class="card">' +
      '<div class="card-head">' +
        '<div class="grow"><div class="eyebrow">Postpaid cycle invoice · ' + row.cust + '</div>' +
          '<h3 style="font-size:16px;font-weight:700;margin-top:2px">' + row.no + '</h3></div>' +
        '<span class="chip ok">One cleared invoice</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="invln">' +
          '<div class="h">Line</div><div class="h r">Net</div><div class="h r">VAT 5%</div>' +
          '<div>Monthly plan · Red 8</div><div class="r">' + omr(plan) + '</div><div class="r">' + omr(plan * 0.05) + '</div>' +
          '<div class="oob-row">Out-of-bundle data · aggregated for the cycle</div>' +
            '<div class="r oob-row">' + omr(oob) + '</div><div class="r oob-row">' + omr(oob * 0.05) + '</div>' +
          '<div class="tot">Invoice total</div><div class="r tot">' + omr(row.net) + '</div><div class="r tot">' + omr(row.vat) + '</div>' +
        '</div>' +
        '<div class="exminor" style="font-size:13px;color:var(--text-mid);margin-top:12px;line-height:1.5">' +
          'Total charged <strong>' + omr(row.total) + '</strong>. The out-of-bundle usage is rated and rolled into ' +
          'this single monthly invoice, itemised as its own line for transparency — <strong>not</strong> sent as a ' +
          'separate e-invoice each time the customer went over the bundle.</div>' +
      '</div>' +
    '</div>';

  document.getElementById('contrast').innerHTML =
    '<div class="contrast">' +
      '<div class="card">' +
        '<div class="card-body">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' + icon('check', 'nav-ico') +
            '<span class="chd">One invoice per cycle</span></div>' +
          '<div class="big-n" style="color:var(--ok)">1</div>' +
          '<div class="big-cap">A single cleared postpaid invoice per customer per month, with out-of-bundle ' +
            'itemised inside it. The tax point stays at consumption; the document count stays sane.</div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-body">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' + icon('alert', 'nav-ico') +
            '<span class="chd">One invoice per usage event</span></div>' +
          '<div class="big-n" style="color:var(--fail)">millions</div>' +
          '<div class="big-cap">Clearing an e-invoice for every over-bundle session would put an unbounded number ' +
            'of documents on the pipe every day — the same tax, at a cost the network could not carry.</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('page-sub').innerHTML =
    'Fawtara&rsquo;s reading: out-of-bundle usage is taxable at consumption, but aggregated into the one monthly ' +
    'postpaid invoice — not one e-invoice per event. To confirm with the OTA.';

  document.getElementById('closing').innerHTML = notice('warn',
    '<strong>This is a recommended position, not a settled rule.</strong> Fawtara will put the aggregation approach ' +
    'to the OTA on Thursday. If the Authority requires a cleared document closer to each event, the tax point is ' +
    'unchanged but the pipeline volume is not — which is precisely why the treatment needs confirming now.');

})();
</script>
</body>
</html>
